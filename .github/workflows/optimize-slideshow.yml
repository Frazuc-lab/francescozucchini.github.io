name: Optimize slideshow photos
on:
  push:
    branches:
      - fix/optimized-slideshow-photos-2026
    paths:
      - .github/workflows/optimize-slideshow.yml
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Recompress large slideshow photographs
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          for path in sorted(Path("Foto").glob("slide-*.webp")):
              before = path.stat().st_size
              with Image.open(path) as image:
                  image = ImageOps.exif_transpose(image)
                  image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  if image.mode not in ("RGB", "RGBA"):
                      image = image.convert("RGB")
                  image.save(path, "WEBP", quality=76, method=6)
              after = path.stat().st_size
              print(f"{path}: {before:,} => {after:,} bytes ({100*after/before:.1f}%)")
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Foto/slide-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize slideshow WebP photographs for faster loading"
            git push
          fi
